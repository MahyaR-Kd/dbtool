name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows binaries
    runs-on: ubuntu-latest
    env:
      LDFLAGS: -s -w -X dbtool/cmd.Version=${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows amd64 binary
        run: GOOS=windows GOARCH=amd64 go build -ldflags="${{ env.LDFLAGS }}" -o dbtool-windows-amd64.exe .

      - name: Build Windows arm64 binary
        run: GOOS=windows GOARCH=arm64 go build -ldflags="${{ env.LDFLAGS }}" -o dbtool-windows-arm64.exe .

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dbtool-windows-amd64.exe
            dbtool-windows-arm64.exe


  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    env:
      LDFLAGS: -s -w -X dbtool/cmd.Version=${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Linux amd64 binary
        run: GOOS=linux GOARCH=amd64 go build -ldflags="${{ env.LDFLAGS }}" -o dbtool-linux-amd64 .

      - name: Build Linux arm64 binary
        run: GOOS=linux GOARCH=arm64 go build -ldflags="${{ env.LDFLAGS }}" -o dbtool-linux-arm64 .

      - name: Upload Linux  artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dbtool-linux-amd64
            dbtool-linux-arm64

  build-darwin:
    name: Build macOS binary
    runs-on: macos-latest
    env:
      LDFLAGS: -s -w -X dbtool/cmd.Version=${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build macOS amd64 slice
        run: GOOS=darwin GOARCH=amd64 go build -ldflags="${{ env.LDFLAGS }}" -o dbtool-darwin-amd64 .

      - name: Build macOS arm64 slice
        run: GOOS=darwin GOARCH=arm64 go build -ldflags="${{ env.LDFLAGS }}" -o dbtool-darwin-arm64 .

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries
          path: |
            dbtool-darwin-amd64
            dbtool-darwin-arm64

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-darwin]

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          name: windows-binaries

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          name: linux-binaries

      - name: Download macOS universal artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: darwin-binaries

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dbtool-windows-amd64.exe
            dbtool-windows-arm64.exe
            dbtool-linux-amd64
            dbtool-linux-arm64
            dbtool-darwin-amd64
            dbtool-darwin-arm64
          generate_release_notes: true
